plugins {
    id "com.android.application"
}

android {
    namespace "com.salman.herbalencyclopedia"
    compileSdk 35

    defaultConfig {
        applicationId "com.salman.herbalencyclopedia"
        minSdk 24
        targetSdk 35

        def vCode = System.getenv("APP_VERSION_CODE")
        def vName = System.getenv("APP_VERSION_NAME")
        versionCode vCode != null ? vCode.toInteger() : 1
        versionName vName != null ? vName : "1.0.0"

        vectorDrawables.useSupportLibrary = true
    }

    // This project keeps its Android sources at app/main instead of the
    // Gradle-default app/src/main. Pointing the "main" source set here
    // permanently fixes builds so no one has to move files or patch this
    // file again before each release.
    sourceSets {
        main {
            manifest.srcFile 'main/AndroidManifest.xml'
            java.srcDirs = ['main/java']
            res.srcDirs = ['main/res']
        }
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath != null && file(storeFilePath).exists()) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath != null && file(storeFilePath).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "HerbalEncyclopedia-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    // تحميل صور الأعشاب (image_url) بشكل أصلي بدون WebView
    implementation "com.github.bumptech.glide:glide:4.16.0"
}

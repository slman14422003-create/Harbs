name: Build APK and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_name:
        description: >-
          تحديد رقم الإصدار يدويًا (مثال: 1.0) بدل الزيادة التلقائية عن آخر
          تاج — استخدمها لإعادة ترقيم الإصدار (مثلاً بعد استقرار نسخة معيّنة
          وإرادة تسميتها "1.0" بصرف النظر عن آخر تاج مرفوع فعلاً). اتركها
          فارغة للسلوك المعتاد (١.٠ ← ١.١ ← ١.٢ ...). لا تُستخدم إطلاقًا في
          تشغيل تلقائي عبر push، فقط عند تشغيل الووركفلو يدويًا من GitHub.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # لا يمكن استخدام "secrets" مباشرة داخل أي شرط if: (قيد من GitHub
      # Actions نفسه، يسبب خطأ "Unrecognized named-value: 'secrets'").
      # لذلك نمرر النتيجة كمتغير env هنا، ونستخدم env.HAS_KEYSTORE_SECRET
      # بدل secrets.ANDROID_KEYSTORE_BASE64 داخل أي if: أدناه.
      HAS_KEYSTORE_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # نحتاج كامل تاريخ التاجات (tags) كي نتمكن من قراءة آخر رقم إصدار
          # وزيادته تلقائيًا (1.0 → 1.1 → 1.2 ...). fetch-depth: 0 = تاريخ كامل.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Resolve next app version (زيادة تلقائية 1.0 → 1.1 → 1.2 ...)
        id: appver
        run: |
          # نجلب كل التاجات المرفوعة سابقًا للمستودع
          git fetch --tags --force >/dev/null 2>&1 || true

          MANUAL_VNAME="${{ github.event.inputs.version_name }}"

          if [ -n "$MANUAL_VNAME" ]; then
            # تشغيل يدوي حدَّد رقم إصدار صراحة: يُستخدم كما هو، متجاوزاً آخر
            # تاج موجود بالكامل (مثلاً لإعادة تسمية أول إصدار مستقر "1.0" حتى
            # لو كانت هناك تاجات أعلى منه من تجارب سابقة). versionCode يبقى
            # دومًا رقم تشغيل الووركفلو أدناه بصرف النظر عن هذا، لذا هذا لا
            # يكسر تحديث المستخدمين ممن ثبّتوا إصدارًا أحدث فعلياً — فقط
            # الاسم الظاهر لهم يتغيّر.
            NEXT_VNAME="$MANUAL_VNAME"
          else
            # آخر تاج بصيغة vMAJOR.MINOR فقط (مثل v1.0, v1.1, v2.3) — نتجاهل أي
            # صيغة قديمة (مثل v2.0.0-45) حتى لا تتعارض مع النظام الجديد.
            LAST_TAG=$(git tag --list 'v*' \
              | sed 's/^v//' \
              | grep -E '^[0-9]+\.[0-9]+$' \
              | sort -t. -k1,1n -k2,2n \
              | tail -1)

            if [ -z "$LAST_TAG" ]; then
              # لا يوجد أي تاج بالصيغة الجديدة بعد → نبدأ من 1.0
              NEXT_VNAME="1.0"
            else
              MAJOR=$(echo "$LAST_TAG" | cut -d. -f1)
              MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
              MINOR=$((MINOR + 1))
              if [ "$MINOR" -ge 10 ]; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
              fi
              NEXT_VNAME="${MAJOR}.${MINOR}"
            fi
          fi

          # versionCode يجب أن يبقى رقمًا صحيحًا متزايدًا دائمًا (شرط أساسي في
          # أندرويد لقبول التحديثات) — نستخدم رقم تشغيل الووركفلو لهذا الغرض.
          VCODE=${{ github.run_number }}

          echo "version_name=$NEXT_VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "الإصدار السابق: ${LAST_TAG:-لا يوجد} → الإصدار الجديد: $NEXT_VNAME ($VCODE)"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare release signing (optional in CI)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app

          # لا ننشئ أبدًا مفتاح توقيع احتياطيًا داخل GitHub Actions.
          # إذا وُجدت أسرار التوقيع، يُبنى Release موقّع. وإذا لم توجد،
          # يُبنى Release غير موقّع حتى لا يفشل CI؛ هذا مناسب للاختبار فقط
          # وليس للرفع إلى Google Play.
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KS_PATH="$GITHUB_WORKSPACE/app/release.keystore.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
            keytool -list -keystore "$KS_PATH" -storepass "$KEYSTORE_PASSWORD" >/dev/null

            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "store_file=$KS_PATH" >> "$GITHUB_OUTPUT"
            echo "store_password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets found; building signed artifacts."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "store_file=" >> "$GITHUB_OUTPUT"
            echo "store_password=" >> "$GITHUB_OUTPUT"
            echo "key_alias=" >> "$GITHUB_OUTPUT"
            echo "key_password=" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. Building unsigned artifacts for CI/testing only. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD for a Play-ready signed build."
          fi

      - name: Build release APK and App Bundle
        env:
          APP_VERSION_CODE: ${{ steps.appver.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.appver.outputs.version_name }}
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          RELEASE_STORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          RELEASE_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          RELEASE_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: |
          # عند توفر أسرار التوقيع، app/build.gradle.kts يقرأ RELEASE_* ويوقّع Release.
          # عند غيابها، يبقى Release غير موقّع ولا يفشل البناء.
          # نستخدم "gradle" (ثبّتها خطوة setup-gradle أعلاه) بدل "./gradlew"
          # لأن ملفات wrapper (gradlew/gradlew.bat/gradle-wrapper.jar) غير
          # موجودة في المستودع.
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

          # التحقق من وجود الملفات المبنية
          echo "Build outputs:"
          find app/build -name "*.apk" -o -name "*.aab" | head -10

      - name: Locate build outputs
        id: outputs
        run: |
          # البحث عن أحدث APK و AAB
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in app/build/outputs/apk/release/"
            find app/build -name "*.apk" 2>/dev/null || echo "No APK files found anywhere"
            exit 1
          fi
          
          if [ -z "$AAB_PATH" ]; then
            echo "::warning::No AAB found in app/build/outputs/bundle/release/"
          fi
          
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"
          echo "Found AAB: $AAB_PATH"

      - name: Upload APK artifact (for direct download)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.outputs.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload App Bundle artifact (for Play Store upload)
        if: ${{ steps.outputs.outputs.aab_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: ${{ steps.outputs.outputs.aab_path }}
          if-no-files-found: warn

      - name: Create GitHub Release (APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version_name }}
          name: الإصدار ${{ steps.appver.outputs.version_name }}
          body: |
            ## 📦 الإصدار ${{ steps.appver.outputs.version_name }}

            - رقم الإصدار: ${{ steps.appver.outputs.version_code }}
            - إذا لم تُضبط أسرار التوقيع، فهذا البناء غير موقّع ومخصص للاختبار فقط.
          generate_release_notes: true
          files: ${{ steps.outputs.outputs.apk_path }}
          fail_on_unmatched_files: true

      - name: Add App Bundle to GitHub Release
        if: ${{ steps.outputs.outputs.aab_path != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version_name }}
          files: ${{ steps.outputs.outputs.aab_path }}
          fail_on_unmatched_files: true

      - name: Cleanup Gradle cache
        if: always()
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/* 2>/dev/null || true

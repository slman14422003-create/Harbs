name: Build APK and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # نحتاج كامل تاريخ التاجات (tags) كي نتمكن من قراءة آخر رقم إصدار
          # وزيادته تلقائيًا (1.0 → 1.1 → 1.2 ...). fetch-depth: 0 = تاريخ كامل.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Resolve next app version (زيادة تلقائية 1.0 → 1.1 → 1.2 ...)
        id: appver
        run: |
          # نجلب كل التاجات المرفوعة سابقًا للمستودع
          git fetch --tags --force >/dev/null 2>&1 || true

          # آخر تاج بصيغة vMAJOR.MINOR فقط (مثل v1.0, v1.1, v2.3) — نتجاهل أي
          # صيغة قديمة (مثل v2.0.0-45) حتى لا تتعارض مع النظام الجديد.
          LAST_TAG=$(git tag --list 'v*' \
            | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n \
            | tail -1)

          if [ -z "$LAST_TAG" ]; then
            # لا يوجد أي تاج بالصيغة الجديدة بعد → نبدأ من 1.0
            NEXT_VNAME="1.0"
          else
            MAJOR=$(echo "$LAST_TAG" | cut -d. -f1)
            MINOR=$(echo "$LAST_TAG" | cut -d. -f2)
            MINOR=$((MINOR + 1))
            if [ "$MINOR" -ge 10 ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
            fi
            NEXT_VNAME="${MAJOR}.${MINOR}"
          fi

          # versionCode يجب أن يبقى رقمًا صحيحًا متزايدًا دائمًا (شرط أساسي في
          # أندرويد لقبول التحديثات) — نستخدم رقم تشغيل الووركفلو لهذا الغرض.
          VCODE=${{ github.run_number }}

          echo "version_name=$NEXT_VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "الإصدار السابق: ${LAST_TAG:-لا يوجد} → الإصدار الجديد: $NEXT_VNAME ($VCODE)"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are required. Refusing to generate or cache a fallback signing key."
            exit 1
          fi
          mkdir -p app
          KS_PATH="$GITHUB_WORKSPACE/app/release.keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS_PATH"
          keytool -list -keystore "$KS_PATH" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          echo "store_file=$KS_PATH" >> "$GITHUB_OUTPUT"
          echo "store_password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Build release APK and App Bundle
        env:
          APP_VERSION_CODE: ${{ steps.appver.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.appver.outputs.version_name }}
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          RELEASE_STORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          RELEASE_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          RELEASE_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: |
          # app/build.gradle.kts يقرأ متغيرات RELEASE_* أعلاه مباشرة وينشئ
          # signingConfig "release" بنفسه — لا حاجة لأي خطوة إضافية هنا.
          # نستخدم "gradle" (ثبّتها خطوة setup-gradle أعلاه) بدل "./gradlew"
          # لأن ملفات wrapper (gradlew/gradlew.bat/gradle-wrapper.jar) غير
          # موجودة في المستودع.
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

          # التحقق من وجود الملفات المبنية
          echo "Build outputs:"
          find app/build -name "*.apk" -o -name "*.aab" | head -10

      - name: Locate build outputs
        id: outputs
        run: |
          # البحث عن أحدث APK و AAB
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in app/build/outputs/apk/release/"
            find app/build -name "*.apk" 2>/dev/null || echo "No APK files found anywhere"
            exit 1
          fi
          
          if [ -z "$AAB_PATH" ]; then
            echo "::warning::No AAB found in app/build/outputs/bundle/release/"
          fi
          
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"
          echo "Found AAB: $AAB_PATH"

      - name: Upload APK artifact (for direct download)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.outputs.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload App Bundle artifact (for Play Store upload)
        if: ${{ steps.outputs.outputs.aab_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: ${{ steps.outputs.outputs.aab_path }}
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version_name }}
          name: الإصدار ${{ steps.appver.outputs.version_name }}
          body: |
            ## 📦 الإصدار ${{ steps.appver.outputs.version_name }}
            
            ### ✅ التغييرات:
            - بناء تلقائي عبر GitHub Actions
            - رقم الإصدار: ${{ steps.appver.outputs.version_code }}
            
            ### 📱 ملفات التحميل:
            - **APK**: للتثبيت المباشر على الأندرويد
            - **AAB**: للرفع على متجر Google Play
          generate_release_notes: true
          files: |
            ${{ steps.outputs.outputs.apk_path }}
            ${{ steps.outputs.outputs.aab_path }}
          fail_on_unmatched_files: true

      - name: Cleanup Gradle cache
        if: always()
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/* 2>/dev/null || true

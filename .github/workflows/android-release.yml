name: Build APK and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # لا يمكن استخدام "secrets" مباشرة داخل أي شرط if: (قيد من GitHub
      # Actions نفسه، يسبب خطأ "Unrecognized named-value: 'secrets'").
      # لذلك نمرر النتيجة كمتغير env هنا، ونستخدم env.HAS_KEYSTORE_SECRET
      # بدل secrets.ANDROID_KEYSTORE_BASE64 داخل أي if: أدناه.
      HAS_KEYSTORE_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Resolve app version
        id: appver
        run: |
          # محاولة قراءة رقم الإصدار من كلا الصيغتين المدعومتين
          if [ -f "app/build.gradle.kts" ]; then
            VNAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)"/\1/')
          elif [ -f "app/build.gradle" ]; then
            VNAME=$(grep -o 'versionName "[^"]*"' app/build.gradle | head -1 | sed -E 's/.*"(.*)"/\1/')
          else
            echo "::error::Could not find app/build.gradle or app/build.gradle.kts"
            exit 1
          fi
          
          VNAME=${VNAME:-1.0.0}
          VCODE=${{ github.run_number }}
          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Building version $VNAME ($VCODE)"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Restore cached fallback keystore
        id: keystore-cache
        if: ${{ env.HAS_KEYSTORE_SECRET != 'true' }}
        uses: actions/cache@v4
        with:
          path: app/fallback.keystore.jks
          key: fallback-keystore-v1
          restore-keys: |
            fallback-keystore-

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # إنشاء مجلد app إذا لم يكن موجوداً
          mkdir -p app
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore supplied via repository secrets (stable, permanent signing identity)."
            KS_PATH="$GITHUB_WORKSPACE/app/release.keystore.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            echo "store_password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
          else
            KS_PATH="$GITHUB_WORKSPACE/app/fallback.keystore.jks"
            if [ -f "$KS_PATH" ]; then
              echo "::warning::No ANDROID_KEYSTORE_BASE64 secret configured. Reusing cached fallback keystore."
            else
              echo "::warning::No ANDROID_KEYSTORE_BASE64 secret and no cached keystore. Generating new one."
              keytool -genkeypair -v \
                -keystore "$KS_PATH" \
                -alias herbal \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass herbal123 -keypass herbal123 \
                -dname "CN=Herbal Encyclopedia, OU=App, O=Salman, L=City, ST=State, C=US"
            fi
            echo "store_password=herbal123" >> "$GITHUB_OUTPUT"
            echo "key_alias=herbal" >> "$GITHUB_OUTPUT"
            echo "key_password=herbal123" >> "$GITHUB_OUTPUT"
          fi
          echo "store_file=$KS_PATH" >> "$GITHUB_OUTPUT"
          
          # عرض معلومات المفتاح للتحقق (بدون كلمات المرور)
          echo "Keystore prepared at: $KS_PATH"
          ls -la "$KS_PATH"

      - name: Save fallback keystore to cache
        if: ${{ env.HAS_KEYSTORE_SECRET != 'true' && steps.keystore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: app/fallback.keystore.jks
          key: fallback-keystore-v1

      - name: Build release APK and App Bundle
        env:
          APP_VERSION_CODE: ${{ steps.appver.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.appver.outputs.version_name }}
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          RELEASE_STORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          RELEASE_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          RELEASE_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: |
          # app/build.gradle.kts يقرأ متغيرات RELEASE_* أعلاه مباشرة وينشئ
          # signingConfig "release" بنفسه — لا حاجة لأي خطوة إضافية هنا.
          # نستخدم "gradle" (ثبّتها خطوة setup-gradle أعلاه) بدل "./gradlew"
          # لأن ملفات wrapper (gradlew/gradlew.bat/gradle-wrapper.jar) غير
          # موجودة في المستودع.
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

          # التحقق من وجود الملفات المبنية
          echo "Build outputs:"
          find app/build -name "*.apk" -o -name "*.aab" | head -10

      - name: Locate build outputs
        id: outputs
        run: |
          # البحث عن أحدث APK و AAB
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in app/build/outputs/apk/release/"
            find app/build -name "*.apk" 2>/dev/null || echo "No APK files found anywhere"
            exit 1
          fi
          
          if [ -z "$AAB_PATH" ]; then
            echo "::warning::No AAB found in app/build/outputs/bundle/release/"
          fi
          
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"
          echo "Found AAB: $AAB_PATH"

      - name: Upload APK artifact (for direct download)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.outputs.outputs.apk_path }}
          if-no-files-found: error

      - name: Upload App Bundle artifact (for Play Store upload)
        if: ${{ steps.outputs.outputs.aab_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: ${{ steps.outputs.outputs.aab_path }}
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version_name }}-${{ steps.appver.outputs.version_code }}
          name: الإصدار ${{ steps.appver.outputs.version_name }} (build ${{ steps.appver.outputs.version_code }})
          body: |
            ## 📦 الإصدار ${{ steps.appver.outputs.version_name }}
            
            ### ✅ التغييرات:
            - بناء تلقائي عبر GitHub Actions
            - رقم الإصدار: ${{ steps.appver.outputs.version_code }}
            
            ### 📱 ملفات التحميل:
            - **APK**: للتثبيت المباشر على الأندرويد
            - **AAB**: للرفع على متجر Google Play
          generate_release_notes: true
          files: |
            ${{ steps.outputs.outputs.apk_path }}
            ${{ steps.outputs.outputs.aab_path }}
          fail_on_unmatched_files: true

      - name: Cleanup Gradle cache
        if: always()
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/* 2>/dev/null || true

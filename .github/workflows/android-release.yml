name: Build APK and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Resolve app version
        id: appver
        run: |
          VNAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)"/\1/')
          VNAME=${VNAME:-1.0.0}
          VCODE=${{ github.run_number }}
          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Building version $VNAME ($VCODE)"

      # بدون هذه الخطوة كان أي بناء بلا أسرار توقيع مُعدّة يولّد مفتاحاً
      # عشوائياً جديداً في كل تشغيل — فيُوقَّع كل إصدار بمفتاح مختلف عن
      # سابقه، ويرفض أندرويد تثبيت التحديث فوق النسخة الحالية لدى المستخدم
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE) حتى يُزيلها يدوياً أولاً.
      # الحل الصحيح والدائم هو أسرار GitHub (الخطوة التالية)، لكن كطبقة
      # حماية إضافية إن لم تُعدَّ بعد: نُخزّن أي مفتاح مولَّد تلقائياً في
      # ذاكرة تخزين GitHub Actions المؤقتة (cache) بمفتاح ثابت، فيُعاد
      # استخدام نفس المفتاح في كل تشغيل تالٍ بدل توليد واحد جديد في كل مرة.
      # ملاحظة: هذه الذاكرة المؤقتة قد تُحذف من GitHub بعد أسابيع من عدم
      # الاستخدام أو عند امتلاء الحصة — الاعتماد الوحيد المضمون 100% طويل
      # المدى هو أسرار ANDROID_KEYSTORE_* أدناه.
      - name: Restore cached fallback keystore
        id: keystore-cache
        if: ${{ !secrets.ANDROID_KEYSTORE_BASE64 }}
        uses: actions/cache@v4
        with:
          path: app/fallback.keystore.jks
          key: fallback-keystore-v1

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore supplied via repository secrets (stable, permanent signing identity)."
            KS_PATH="$GITHUB_WORKSPACE/app/release.keystore.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            echo "store_password=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
          else
            KS_PATH="$GITHUB_WORKSPACE/app/fallback.keystore.jks"
            if [ -f "$KS_PATH" ]; then
              echo "::warning::No ANDROID_KEYSTORE_BASE64 secret configured. Reusing the cached fallback keystore from a previous run so this update installs over the last one. This cache is NOT guaranteed to persist forever — add ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets as soon as possible for a permanent signing identity."
            else
              echo "::warning::No ANDROID_KEYSTORE_BASE64 secret configured and no cached fallback keystore found. Generating a NEW one now and caching it for future runs. Add the secrets mentioned above to make this permanent and safe against cache eviction."
              keytool -genkeypair -v \
                -keystore "$KS_PATH" \
                -alias herbal \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass herbal123 -keypass herbal123 \
                -dname "CN=Herbal Encyclopedia, OU=App, O=Salman, L=City, ST=State, C=US"
            fi
            echo "store_password=herbal123" >> "$GITHUB_OUTPUT"
            echo "key_alias=herbal" >> "$GITHUB_OUTPUT"
            echo "key_password=herbal123" >> "$GITHUB_OUTPUT"
          fi
          echo "store_file=$KS_PATH" >> "$GITHUB_OUTPUT"

      - name: Save fallback keystore to cache
        if: ${{ !secrets.ANDROID_KEYSTORE_BASE64 && steps.keystore-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: app/fallback.keystore.jks
          key: fallback-keystore-v1

      - name: Build release APK and App Bundle
        env:
          APP_VERSION_CODE: ${{ steps.appver.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.appver.outputs.version_name }}
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          RELEASE_STORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          RELEASE_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          RELEASE_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: |
          # APK للتوزيع المباشر/الاختبار (GitHub Release)، وAAB (App Bundle)
          # لأنه الصيغة التي يتطلبها متجر Play الآن عند الرفع.
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Locate build outputs
        id: outputs
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"
          echo "Found AAB: $AAB_PATH"

      - name: Upload App Bundle artifact (for Play Store upload)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: ${{ steps.outputs.outputs.aab_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version_name }}-${{ steps.appver.outputs.version_code }}
          name: الإصدار ${{ steps.appver.outputs.version_name }} (build ${{ steps.appver.outputs.version_code }})
          generate_release_notes: true
          files: |
            ${{ steps.outputs.outputs.apk_path }}
            ${{ steps.outputs.outputs.aab_path }}
